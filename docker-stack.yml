# Stack Docker Swarm do Plenário na VPS.
# Subir:     docker stack deploy -c /opt/plenario/docker-stack.yml plenario
# Serviço:   plenario_plenario_app
# Código:    /opt/plenario (bind mount)  |  .env em /opt/plenario/.env
version: "3.7"

services:
  plenario_app:
    image: plenario_app:latest
    volumes:
      - /opt/plenario:/var/www/html
    networks:
      - SGDMNET
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 512M
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 30s
      labels:
        - traefik.enable=true
        - traefik.docker.network=SGDMNET
        - traefik.http.routers.plenario.rule=Host(`plenariovera.com.br`)
        - traefik.http.routers.plenario.entrypoints=websecure
        - traefik.http.routers.plenario.tls.certresolver=letsencryptresolver
        - traefik.http.services.plenario.loadbalancer.server.port=80

networks:
  SGDMNET:
    external: true
    name: SGDMNET
