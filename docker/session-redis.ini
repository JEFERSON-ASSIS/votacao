; Sessões de login no Redis compartilhado da VPS (serviço redis_redis):
; o deploy recria o container sem deslogar ninguém, nem durante uma sessão.
; Banco 2 e prefixo próprio evitam mistura com outros sistemas.
session.save_handler = redis
session.save_path = "tcp://redis_redis:6379?database=2&prefix=plenario:session:"
redis.session.locking_enabled = 1
redis.session.lock_retries = 20
redis.session.lock_wait_time = 2000

; Login dura até 6 horas (uma sessão plenária longa não derruba ninguém).
session.gc_maxlifetime = 21600
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.cookie_secure = 1
session.use_strict_mode = 1
