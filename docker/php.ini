; Configuração do PHP para o Plenário (produção).
date.timezone = America/Cuiaba
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M

; Anexos do roteiro e atas: limite do sistema é 15 MB por arquivo.
upload_max_filesize = 20M
post_max_size = 25M

; Os canais ao vivo (SSE) ficam abertos até 5 minutos.
max_execution_time = 330
